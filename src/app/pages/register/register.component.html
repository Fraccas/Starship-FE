<div class="auth-shell glass-panel">
  <h2>Create Account</h2>
  <p class="subtle-text">Join the fleet to start saving your favorite starships.</p>

  <form #registerForm="ngForm" (ngSubmit)="register(registerForm)" novalidate>
    <div class="form-field">
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" name="email" [(ngModel)]="email" required email #emailCtrl="ngModel" placeholder="you@galaxy.com" />
      <p class="form-hint" *ngIf="emailCtrl.invalid && emailCtrl.touched">
        Please enter a valid email address.
      </p>
    </div>

    <div class="form-field">
      <label for="reg-password">Password</label>
      <input id="reg-password" type="password" [(ngModel)]="password" name="password" placeholder="Password" required minlength="6" #passwordCtrl="ngModel" />
      <p class="form-hint" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
        Password must be at least 6 characters.
      </p>
    </div>

    <div class="form-field">
      <label for="reg-confirm">Confirm Password</label>
      <input id="reg-confirm" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
        required #confirmCtrl="ngModel" />
      <p class="form-hint" *ngIf="confirmCtrl.invalid && confirmCtrl.touched">
        Please confirm your password.
      </p>
      <p class="form-hint" *ngIf="passwordMismatch">Passwords do not match.</p>
    </div>

    <button type="submit" class="button-primary" [disabled]="registerForm.invalid">Register</button>
  </form>

  <p class="form-hint" *ngIf="error">{{ error }}</p>
  <p class="success" *ngIf="success">{{ success }}</p>
</div>
