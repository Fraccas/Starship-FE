<div class="register-container">
  <h2>Create Account</h2>

  <form (ngSubmit)="register()">
    <input type="email" name="email" [(ngModel)]="email" required #emailCtrl="ngModel" placeholder="Email" />

    <p class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
      Please enter a valid email address.
    </p>

    <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required />

    <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
      required />

    <button type="submit">Register</button>
  </form>

  <p class="error" *ngIf="error">{{ error }}</p>
  <p class="success" *ngIf="success">{{ success }}</p>
</div>
