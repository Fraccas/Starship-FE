<h2>Starships</h2>

<div *ngIf="loading">Loading...</div>

<div class="grid" *ngIf="!loading">
  <div class="card" *ngFor="let ship of starships">
    
    <h3>{{ ship.name }}</h3>
    <p><strong>Model:</strong> {{ ship.model }}</p>
    <p><strong>Class:</strong> {{ ship.starshipClass }}</p>
    <p><strong>Manufacturer:</strong> {{ ship.manufacturer }}</p>

    <!-- Only logged in users can favorite -->
    <button 
      *ngIf="auth.isLoggedIn()" 
      (click)="addFavorite(ship.id)">
      Add to Favorites
    </button>

  </div>
</div>
