<h2>Admin: Manage Starships</h2>

<button class="create-btn" (click)="startCreate()">+ Create New Starship</button>

<div *ngIf="loading">Loading...</div>

<table *ngIf="!loading">
  <thead>
    <tr>
      <th>Name</th>
      <th>Model</th>
      <th>Class</th>
      <th>Manufacturer</th>
      <th style="width: 160px;"></th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let ship of starships">
      <td>{{ ship.name }}</td>
      <td>{{ ship.model }}</td>
      <td>{{ ship.starshipClass }}</td>
      <td>{{ ship.manufacturer }}</td>
      <td>
        <button (click)="startEdit(ship)">Edit</button>
        <button (click)="delete(ship.id)" class="danger">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- INLINE CREATE/EDIT FORM -->
<div class="editor" *ngIf="editing">
  <h3>{{ isNew ? 'Create Starship' : 'Edit Starship' }}</h3>

  <form (ngSubmit)="save()">
    <label>
      Name
      <input [(ngModel)]="formModel.name" name="name" required>
    </label>

    <label>
      Model
      <input [(ngModel)]="formModel.model" name="model" required>
    </label>

    <label>
      Manufacturer
      <input [(ngModel)]="formModel.manufacturer" name="manufacturer">
    </label>

    <label>
      Class
      <input [(ngModel)]="formModel.starshipClass" name="starshipClass">
    </label>

    <label>
      Hyperdrive Rating
      <input [(ngModel)]="formModel.hyperdriveRating" name="hyperdriveRating">
    </label>

    <label>
      Max Atmosphering Speed
      <input [(ngModel)]="formModel.maxAtmospheringSpeed" name="maxAtmospheringSpeed">
    </label>

    <label>
      Crew
      <input [(ngModel)]="formModel.crew" name="crew">
    </label>

    <label>
      Passengers
      <input [(ngModel)]="formModel.passengers" name="passengers">
    </label>

    <div class="buttons">
      <button type="submit">{{ isNew ? 'Create' : 'Save' }}</button>
      <button type="button" (click)="cancelEdit()">Cancel</button>
    </div>
  </form>
</div>
